<ui-toolbar uiSticky class="sc-shell__header">
  <span uiText uiFont="headline">Creativo Design System</span>
  <nav class="sc-shell__nav">
    <!-- Row layout is the DS HStack; only the active-link underline stays
         local shell chrome. -->
    <ui-stack uiAxis="horizontal" uiSpacing="comfortable" uiAlignment="center">
      <a
        routerLink="/tokens"
        routerLinkActive="sc-shell__nav-link--active"
        uiText
        uiFont="callout"
        uiForegroundStyle="secondary"
        >Tokens</a
      >
      <a
        routerLink="/controls"
        routerLinkActive="sc-shell__nav-link--active"
        uiText
        uiFont="callout"
        uiForegroundStyle="secondary"
        >Controls</a
      >
    </ui-stack>
  </nav>

  <ui-spacer />

  <ui-stack
    uiAxis="horizontal"
    uiSpacing="tight"
    uiAlignment="center"
    data-testid="design-system-toggles"
  >
    @for (density of densities; track density) {
    <button
      uiChip
      [uiSelected]="preferences.density() === density"
      [uiControlSize]="'small'"
      type="button"
      (click)="preferences.setDensity(density)"
    >
      {{ density }}
    </button>
    }
    <button
      uiButton
      [uiButtonStyle]="'strokedBorder'"
      [uiControlSize]="'small'"
      type="button"
      (click)="preferences.toggleTheme()"
    >
      {{ preferences.theme() === 'dark' ? 'Light' : 'Dark' }}
    </button>
  </ui-stack>
</ui-toolbar>

<main uiPaddingHorizontal="comfortable" uiPaddingVertical="loose">
  <router-outlet />
</main>
