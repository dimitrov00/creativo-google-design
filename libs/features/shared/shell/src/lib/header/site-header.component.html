<ng-container *transloco="let t">
  <header
    class="cr-header"
    data-testid="site-header"
    [attr.data-view]="isSolid() ? 'solid' : 'float'"
    [style.transform]="headerTransform()"
  >
    <ui-toolbar
      class="cr-header__inner"
      uiFrame
      [uiFrameMaxWidth]="'var(--landing-max-width)'"
      [uiToolbarBackground]="isSolid() ? 'automatic' : 'hidden'"
    >
      <a routerLink="/" class="cr-header__brand" aria-label="Creativo">
        <img
          [src]="logoWhite() ? '/logo-white.svg' : '/logo-black.svg'"
          alt="Creativo"
          uiFrame
          [uiFrameHeight]="'1.5rem'"
        />
      </a>

      <ui-stack uiAxis="horizontal" uiAlignment="center" uiSpacing="tight">
        @if (!isAuthed()) {
          <a
            routerLink="/auth"
            [queryParams]="{ redirect: '/account' }"
            uiButton
            [uiButtonStyle]="isSolid() ? 'bordered' : 'glass'"
            uiControlSize="regular"
            uiButtonBorderShape="capsule"
            data-testid="site-login-pill"
          >
            <ui-icon uiName="auth.locked" />
            {{ t('landing.nav.login') }}
          </a>
        }

        <button
          type="button"
          uiButton
          [uiButtonStyle]="isSolid() ? 'bordered' : 'glass'"
          uiControlSize="regular"
          uiButtonBorderShape="capsule"
          [uiIconOnly]="true"
          [uiSelected]="menuOpen()"
          data-testid="nav-menu-trigger"
          [attr.aria-label]="
            menuOpen() ? t('landing.nav.close') : t('landing.nav.menu')
          "
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          @if (isAuthed() && !menuOpen()) {
            <!-- Signed-in trigger = the account monogram (Apple HIG:
                 App-Store-style profile circle, initials fallback) —
                 morphs back to the ✕ while the menu is open. -->
            <ui-avatar
              class="cr-header__monogram"
              [uiSrc]="identity.avatarUrl()"
              [uiName]="identity.displayName()"
              uiControlSize="regular"
            />
          } @else {
            <cr-menu-icon [open]="menuOpen()" />
          }
        </button>
      </ui-stack>
    </ui-toolbar>
  </header>

  <cr-site-menu
    [open]="menuOpen()"
    [isAuthed]="isAuthed()"
    (closed)="menuOpen.set(false)"
  />
</ng-container>
