<ng-container *transloco="let t">
  <section class="cr-courses__section">
    <div class="cr-courses__card cr-squircle" uiReveal="fade-up">
      <!-- Still photo, not video (distinct from cr-hiring-section's film) —
           a slow continuous zoom stands in for the ambient loop until a
           real course photo replaces this placeholder. -->
      <img
        class="cr-courses__image"
        src="/work/classic-clippers.jpg"
        alt=""
        aria-hidden="true"
        loading="lazy"
      />
      <div uiOverlay="scrim-media" aria-hidden="true"></div>

      <div class="cr-courses__content">
        <ui-section-header uiAlignment="center" [uiOnMedia]="true">
          <p uiEyebrow uiReveal="fade-up" [uiRevealDelay]="50">
            {{ t('landing.courses.eyebrow') }}
          </p>
          <h2 uiTitle>{{ t('landing.courses.title') }}</h2>
          <p uiLede uiReveal="fade-up" [uiRevealDelay]="120">
            {{ t('landing.courses.subtitle') }}
          </p>
        </ui-section-header>

        <div uiReveal="fade-up" [uiRevealDelay]="180">
          <a
            uiButton
            uiButtonStyle="glass"
            [uiOnMedia]="true"
            uiControlSize="large"
            class="cr-courses__cta"
            routerLink="/courses"
            data-testid="landing-courses-cta"
          >
            {{ t('landing.courses.cta') }}
            <ui-icon uiName="nav.explore" />
          </a>
        </div>
      </div>
    </div>
  </section>
</ng-container>
