<!-- v2 routes/index.tsx LandingPage — the page shell. -->
<div class="cr-landing" data-page-shell>
  <!-- Safe-area strips: keep the notch / home-indicator on plain background
       as content scrolls beneath (v2's fixed h-safe-top/bottom bands). -->
  <div class="cr-landing__safe cr-landing__safe--top" aria-hidden="true"></div>
  <div
    class="cr-landing__safe cr-landing__safe--bottom"
    aria-hidden="true"
  ></div>

  <cr-site-header />
  <cr-landing-hero />

  <!-- Funnel order (owner call, 2026-07-23): proof leads — the work
       gallery sits directly under the hero — then the offer (services),
       then team, then logistics (locations), with the two "join us"
       pitches (courses, then hiring) demoted to the very end. -->
  <!-- .cr-landing__main is a structural hook only (covered by the outer
       [data-page-shell]'s inert freeze while the nav menu is open); the
       centered column rides uiFrame. -->
  <main
    class="cr-landing__main"
    uiFrame
    [uiFrameMaxWidth]="'var(--landing-max-width)'"
  >
    <div id="work" class="cr-landing__anchor">
      <cr-work-gallery />
    </div>
    <div id="services" class="cr-landing__anchor">
      <cr-services-section />
    </div>
    <div id="team" class="cr-landing__anchor">
      <cr-team-showcase />
    </div>
    <div id="visit" class="cr-landing__anchor">
      <!-- The locations section owns a MapLibre map (~1MB) — `@defer (on
           viewport)` keeps it out of the initial bundle (v2 lazy rule). -->
      @defer (on viewport) {
      <cr-locations />
      } @placeholder {
      <!-- Reserves room so the section doesn't jump on hydrate. -->
      <ui-skeleton
        uiAnimation="none"
        uiRadius="regular"
        uiFrame
        [uiFrameHeight]="'40rem'"
        aria-hidden="true"
      />
      }
    </div>
    <div id="courses" class="cr-landing__anchor">
      <cr-courses-section />
    </div>
    <div id="hiring" class="cr-landing__anchor">
      <cr-hiring-section />
    </div>
  </main>

  <cr-site-footer [flagshipLocation]="flagshipLocation()" />

  <!-- The ONE service detail sheet. Sections open it through
       CatalogNavigationService; following a reference inside it REOPENS it
       on the new subject — one surface, one subject, no stack. -->
  @if (catalog.current(); as service) {
  <cr-catalog-sheet
    [service]="service"
    (serviceSelected)="catalog.open($event)"
    (barberSelected)="catalog.openBarber($event.id)"
    (closed)="catalog.close()"
  />
  }
</div>
