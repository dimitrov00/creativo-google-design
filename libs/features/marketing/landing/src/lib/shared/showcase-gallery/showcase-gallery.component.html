<section class="showcase-gallery" [attr.aria-label]="ariaLabel()">
  <!-- Compact gap = the toggle row's old pitch above the track. -->
  <ui-stack uiSpacing="compact">
    @if (showToggle()) {
      <!-- Spacer end-pins the toggle; the row carries the sheet gutter so
           the button lines up with the track's content edge. -->
      <ui-stack
        uiAxis="horizontal"
        uiAlignment="center"
        uiSpacing="none"
        class="showcase-gallery__toolbar"
      >
        <ui-spacer />
        <!-- View toggle — PLAIN per HIG (presentation-only controls stay
             borderless), and NO selected state: the glyph names the view
             you'd switch TO, so a persistent fill read as stuck-active
             (owner ruling 2026-07-27, same as the performers toggle). -->
        <button
          type="button"
          uiButton
          uiButtonStyle="plain"
          uiButtonBorderShape="capsule"
          uiControlSize="regular"
          [uiIconOnly]="true"
          [attr.aria-label]="expanded() ? carouselViewLabel() : gridViewLabel()"
          (click)="toggleLayout()"
        >
          <ui-icon [uiName]="expanded() ? 'gallery.strip' : 'gallery.grid'" />
        </button>
      </ui-stack>
    }

    @if (expanded()) {
      <ui-grid
        class="showcase-gallery__track"
        [uiColumns]="3"
        uiSpacing="compact"
      >
        @for (image of images(); track $index) {
          <figure uiRadius="prominent">
            <ui-async-image [uiSrc]="image" [uiAlt]="imageAlt()" />
          </figure>
        }
      </ui-grid>
    } @else {
      <ui-scroll-row
        class="showcase-gallery__track"
        uiSnap="center"
        uiSpacing="compact"
      >
        @for (image of images(); track $index) {
          <figure uiRadius="prominent">
            <ui-async-image [uiSrc]="image" [uiAlt]="imageAlt()" />
          </figure>
        }
      </ui-scroll-row>
    }
  </ui-stack>
</section>
