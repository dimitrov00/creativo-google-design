@if (shown(); as page) {
<ui-modal-sheet
  sheetId="analytics-rows"
  [labelledBy]="titleId"
  [closeLabel]="page.closeLabel"
  [open]="open()"
  [closing]="closing()"
  uiPresentationSizing="automatic"
  data-testid="analytics-rows"
  (dismissed)="requestClose()"
  (closeFinished)="finishClose()"
>
  <span sheet-title>{{ page.title }}</span>

  <div class="analytics-rows__head">
    <ui-sheet-headline>
      <h2 uiSheetLargeTitle [id]="titleId" uiText uiFont="largeTitle">
        {{ page.title }}
      </h2>
      <p uiText uiFont="callout" uiForegroundStyle="secondary">
        {{ page.lede }}
      </p>
    </ui-sheet-headline>
  </div>

  <div class="analytics-rows__body">
    <lib-analytics-rows
      [vm]="page"
      (openBarber)="pickBarber($event)"
      (openMonth)="openMonth.emit($event)"
    />
  </div>
</ui-modal-sheet>
}
