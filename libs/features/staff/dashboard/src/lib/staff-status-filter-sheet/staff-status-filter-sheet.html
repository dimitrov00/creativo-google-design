<ui-modal-sheet
  sheetId="staff-status-filter-sheet"
  labelledBy="staff-status-filter-title"
  [closeLabel]="t('staff.day.cancelDismiss')"
  [open]="true"
  data-testid="staff-status-filter-sheet"
  (dismissed)="closed.emit()"
>
  <span sheet-title>{{ t('staff.day.statusFilterTitle') }}</span>

  <ui-stack uiSpacing="loose" class="staff-status-filter__body">
    <ui-sheet-headline class="staff-status-filter__headline">
      <h2
        id="staff-status-filter-title"
        uiSheetLargeTitle
        uiText
        uiFont="largeTitle"
      >
        {{ t('staff.day.statusFilterTitle') }}
      </h2>
      <p uiText uiFont="subheadline" uiForegroundStyle="secondary">
        {{ t('staff.day.statusFilterLede') }}
      </p>
    </ui-sheet-headline>

    <ui-list-group>
      @for (row of rows(); track row.bookingStatus) {
      <ui-list-row uiSize="large">
        <span uiLeading><ui-icon [uiName]="row.glyph" /></span>
        {{ row.label }}
        <button
          uiSwitch
          uiTrailing
          [uiOn]="row.shown"
          [attr.aria-label]="row.label"
          [attr.data-testid]="'staff-status-' + row.bookingStatus"
          (uiOnChange)="toggle(row.bookingStatus)"
        ></button>
      </ui-list-row>
      }
    </ui-list-group>

    <!-- BLOCKED TIME, its own group: time a chair took off the book is not
         a booking state, but it is drawn on the same schedule. -->
    <ui-list-group>
      <ui-list-row uiSize="large">
        <span uiLeading><ui-icon uiName="booking.blocked" /></span>
        {{ t('staff.day.statusFilterBlocks') }}
        <button
          uiSwitch
          uiTrailing
          [uiOn]="!blocksHidden()"
          [attr.aria-label]="t('staff.day.statusFilterBlocks')"
          data-testid="staff-status-blocks"
          (uiOnChange)="blocksHidden.set(!blocksHidden())"
        ></button>
      </ui-list-row>
    </ui-list-group>
  </ui-stack>

  <!-- RESET · APPLY (Zocdoc, Beli, Insight Timer): the quiet reset on the
       leading side, greyed while nothing is hidden; the primary on the
       thumb side, hugging its word. ✕ leaves the schedule as it was. -->
  <ui-sheet-action-bar sheet-overlay [uiVisible]="true">
    <button
      type="button"
      uiButton
      uiButtonStyle="bordered"
      uiTint="neutral"
      uiControlSize="large"
      [disabled]="!resettable()"
      data-testid="staff-status-reset"
      (click)="reset()"
    >
      {{ t('staff.day.statusFilterReset') }}
    </button>
    <button
      type="button"
      uiButton
      uiButtonStyle="borderedProminent"
      uiControlSize="large"
      uiPrimary
      data-testid="staff-status-apply"
      (click)="apply()"
    >
      {{ t('staff.day.statusFilterApply') }}
    </button>
  </ui-sheet-action-bar>
</ui-modal-sheet>
