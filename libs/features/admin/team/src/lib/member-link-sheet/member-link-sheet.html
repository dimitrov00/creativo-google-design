<ng-container *transloco="let t">
  <lib-account-pick-sheet
    uiSheetId="member-link"
    [uiTitle]="t('admin.team.link.title')"
    [uiVm]="vm()"
    [uiQuestion]="question()"
    [uiQuestionOpen]="questionOpen()"
    [uiRefusal]="refusal()"
    [uiPending]="store.pending()"
    [uiSearching]="lookup.searching()"
    [uiClosing]="uiClosing()"
    (queried)="lookup.ask($event)"
    (picked)="pick($event)"
    (answered)="answer($event)"
    (questionDismissed)="questionOpen.set(false)"
    (dismissed)="dismissed.emit()"
    (closeFinished)="closeFinished.emit()"
  />
</ng-container>
