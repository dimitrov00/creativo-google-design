<ng-container *transloco="let t">
  <ui-modal-sheet
    sheetId="member-period-sheet"
    labelledBy="member-period-sheet-title"
    [closeLabel]="t('admin.team.add.close')"
    [open]="!uiClosing()"
    [closing]="uiClosing()"
    data-testid="member-period-sheet"
    (dismissed)="dismissed.emit()"
    (closeFinished)="closeFinished.emit()"
  >
    <span sheet-title>{{ t('admin.team.period.title') }}</span>

    <div class="team-page__form">
      <h2
        id="member-period-sheet-title"
        uiSheetLargeTitle
        uiText
        uiFont="largeTitle"
      >
        {{ t('admin.team.period.title') }}
      </h2>

      @if (refusal(); as line) {
      <ui-notice
        uiTone="destructive"
        uiAnnounce="polite"
        data-testid="member-period-refusal"
      >
        {{ line }}
      </ui-notice>
      } @else if (!valid()) {
      <ui-notice
        uiTone="destructive"
        uiAnnounce="polite"
        data-testid="member-period-invalid"
      >
        {{ t('errors.TEAM_PERIOD_INVALID') }}
      </ui-notice>
      }

      <!-- THE TWO DAYS, each a date row: the day in a capsule at the
           row's end that pops the month — the app's one way to ask for a
           date. The last day is optional, and «no last day» is one of the
           answers its month offers, never a row of its own (owner,
           2026-11-16). Its month dots the days the barber is booked on and
           says so under the grid, so the day is chosen against the visits
           it cuts. -->
      <ui-list-group>
        <ui-date-row
          uiTestId="member-period-start"
          [uiLabel]="t('admin.team.period.start')"
          [uiSelected]="starts()"
          [uiToday]="uiToday()"
          [uiLocale]="locale()"
          [uiPreviousLabel]="t('admin.team.period.previousMonth')"
          [uiNextLabel]="t('admin.team.period.nextMonth')"
          [uiDisabled]="store.pending()"
          (uiPicked)="starts.set($event)"
        />
        <ui-date-row
          uiTestId="member-period-last"
          [uiLabel]="t('admin.team.period.last')"
          [uiSelected]="last()"
          [uiPlaceholder]="t('admin.team.period.lastNone')"
          [uiClearLabel]="t('admin.team.period.lastClear')"
          [uiToday]="uiToday()"
          [uiMin]="starts()"
          [uiOpensOn]="lastOpensOn()"
          [uiMarked]="bookedDays()"
          [uiMarkedLabel]="t('admin.team.period.marked')"
          [uiLocale]="locale()"
          [uiPreviousLabel]="t('admin.team.period.previousMonth')"
          [uiNextLabel]="t('admin.team.period.nextMonth')"
          [uiDisabled]="store.pending()"
          (uiPicked)="last.set($event)"
          (uiCleared)="last.set(null)"
        />
      </ui-list-group>

      <!-- WHAT THE LAST DAY WILL DO — one notice for one day: the
           departure as a quiet fact, or, once visits fall after the day,
           a warning that counts them and says the departure in its body.
           Leaving cancels nothing; the warning's one action opens the
           schedule's search on those visits (owner, 2026-11-16). -->
      @if (outlook().notice; as notice) {
      <ui-notice
        [uiTone]="notice.tone"
        [uiIcon]="notice.tone === 'neutral' ? 'notice.info' : null"
        uiAnnounce="polite"
        [attr.data-testid]="notice.testId"
      >
        <h3 uiNoticeTitle>{{ notice.title }}</h3>
        {{ notice.body }} @if (searchAfter(); as last) {
        <lib-leftover-search
          uiNoticeActions
          [uiBarberId]="uiBarber().id"
          [uiAfter]="last"
        />
        }
      </ui-notice>
      }
    </div>

    <ui-sheet-action-bar sheet-overlay [uiVisible]="true">
      <button
        type="button"
        uiButton
        uiButtonStyle="borderedProminent"
        [uiSpread]="true"
        [uiLoading]="store.pending()"
        [disabled]="!canSave() || store.pending()"
        data-testid="member-period-save"
        (click)="save()"
      >
        {{ t('admin.team.period.save') }}
      </button>
    </ui-sheet-action-bar>
  </ui-modal-sheet>

  <!-- A last day already passed makes the barber leave at once: asked first. -->
  <ui-alert
    [uiPresented]="questionOpen()"
    [uiTitle]="outlook().question?.title ?? ''"
    [uiMessage]="outlook().question?.message ?? ''"
    [uiActions]="outlook().question?.actions ?? []"
    data-testid="member-period-leave-question"
    (uiPicked)="answer($event)"
    (uiDismissed)="questionOpen.set(false)"
  />
</ng-container>
