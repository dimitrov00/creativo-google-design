<svg
  #drawing
  class="ui-line-chart__drawing"
  role="img"
  [attr.aria-label]="uiLabel()"
  [attr.viewBox]="viewBox()"
  [attr.data-scrubbable]="uiScrubbable() ? '' : null"
  [attr.data-scrubbing]="scrub() === null ? null : ''"
  (pointerdown)="scrubStart($event)"
  (pointermove)="scrubMove($event)"
  (pointerup)="scrubEnd($event)"
  (pointercancel)="scrubEnd($event)"
  (pointerleave)="scrubEnd($event)"
>
  @if (uiTexture()) {
  <!-- THE TEXTURE (Revolut's newer charts): dotted guides in the ink every
       14 px behind the plot, full up to its upper third and fading out
       only there — texture, never data, so it sits under every mark. -->
  <defs>
    <pattern
      [attr.id]="textureIds.pattern"
      patternUnits="userSpaceOnUse"
      width="14"
      height="10"
    >
      <line class="ui-chart-texture__line" x1="1" y1="1" x2="1" y2="11" />
    </pattern>
    <linearGradient [attr.id]="textureIds.fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.35" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="1" />
    </linearGradient>
    <mask [attr.id]="textureIds.mask">
      <rect
        [attr.x]="textureBox().x"
        [attr.y]="textureBox().y"
        [attr.width]="textureBox().width"
        [attr.height]="textureBox().height"
        [attr.fill]="'url(#' + textureIds.fade + ')'"
      />
    </mask>
  </defs>
  <rect
    class="ui-chart-texture"
    [attr.x]="textureBox().x"
    [attr.y]="textureBox().y"
    [attr.width]="textureBox().width"
    [attr.height]="textureBox().height"
    [attr.fill]="'url(#' + textureIds.pattern + ')'"
    [attr.mask]="'url(#' + textureIds.mask + ')'"
  />
  } @if (uiArea()) {
  <defs>
    <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="0" y2="1">
      <stop class="ui-line-chart__area-top" offset="0" />
      <stop class="ui-line-chart__area-base" offset="1" />
    </linearGradient>
  </defs>
  } @for (node of linePaths(); track node.key) { @if (node.area) {
  <path
    class="ui-line-chart__area"
    [attr.d]="node.area"
    [attr.fill]="areaFill"
    [attr.data-leave]="node.leaving ? '' : null"
    [attr.data-enter]="!node.leaving && linePaths().length > 1 ? '' : null"
  />
  } } @if (comparisonPath()) {
  <path
    class="ui-line-chart__comparison"
    [attr.data-part]="comparisonPart"
    [attr.d]="comparisonPath()"
  />
  } @for (line of seriesShapes(); track $index) { @if (line.d) {
  <path
    class="ui-line-chart__series"
    [attr.data-tone]="line.tone"
    [attr.d]="line.d"
  />
  } @if (line.end; as end) {
  <circle
    class="ui-line-chart__series-end"
    [attr.data-tone]="line.tone"
    r="3.5"
    [attr.cx]="end.x"
    [attr.cy]="end.y"
  />
  } } @if (averageY() !== null) {
  <line
    class="ui-line-chart__average"
    x1="6"
    [attr.x2]="plotEnd()"
    [attr.y1]="averageY()"
    [attr.y2]="averageY()"
  />
  } @for (node of linePaths(); track node.key) { @if (node.d) {
  <path
    class="ui-line-chart__path"
    [attr.d]="node.d"
    [attr.data-leave]="node.leaving ? '' : null"
    [attr.data-enter]="!node.leaving && linePaths().length > 1 ? '' : null"
    (animationend)="dropLeaving()"
  />
  } } @for (marker of markers(); track $index) {
  <circle
    class="ui-line-chart__marker"
    r="4"
    [attr.cx]="marker.x"
    [attr.cy]="marker.y"
  />
  } @if (scrub(); as at) {
  <!-- THE SCRUB: the day under the finger — a hairline down the plot and
       a dot on each line there (Revolut's, Apple Health's). -->
  <line
    class="ui-line-chart__scrub-line"
    [attr.x1]="at.x"
    [attr.x2]="at.x"
    [attr.y1]="at.top"
    [attr.y2]="at.bottom"
  />
  @if (at.comparisonY !== null) {
  <circle
    class="ui-line-chart__scrub-dot"
    [attr.data-part]="comparisonPart"
    r="4.5"
    [attr.cx]="at.x"
    [attr.cy]="at.comparisonY"
  />
  } @for (dot of at.series; track $index) {
  <circle
    class="ui-line-chart__scrub-dot ui-line-chart__series-dot"
    [attr.data-tone]="dot.tone"
    r="4.5"
    [attr.cx]="at.x"
    [attr.cy]="dot.y"
  />
  } @if (at.valueY !== null) {
  <circle
    class="ui-line-chart__scrub-dot"
    r="5"
    [attr.cx]="at.x"
    [attr.cy]="at.valueY"
  />
  } } @for (label of edgeLabels(); track $index) {
  <text
    class="ui-line-chart__edge-label"
    aria-hidden="true"
    [attr.x]="label.x"
    [attr.y]="label.y"
  >
    {{ label.text }}
  </text>
  }
</svg>
@if (rows().length > 0) {
<!-- The hidden table sits in a hidden 1px box: a table treats its own
     width as a minimum, so on the table itself the recipe would stretch
     to the caption and push the page sideways. -->
<div uiVisuallyHidden class="ui-line-chart__a11y">
  <table class="ui-line-chart__table">
    <caption>
      {{ uiLabel() }}
    </caption>
    <tbody>
      @for (row of rows(); track $index) {
      <tr>
        <th scope="row">{{ row.label }}</th>
        <td>{{ row.value }}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
}
