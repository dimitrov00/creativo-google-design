<button
  crButton
  type="button"
  variant="ghost"
  size="small"
  [attr.aria-pressed]="themeService.theme() === 'dark'"
  aria-label="Toggle color theme"
  (click)="themeService.toggle()"
>
  @if (themeService.theme() === 'dark') {
  <ui-icon uiName="prefs.theme.dark" />
  } @else {
  <ui-icon uiName="prefs.theme.light" />
  }
</button>
